name: Remove old builds
# Run by hand (Actions tab). Deletes the GitHub releases (and their tags)
# build-1 .. build-<up_to>, with every APK / AAB / IPA attached, and every
# workflow artifact. Can't be undone; Play is unaffected.
on:
  workflow_dispatch:
    inputs:
      up_to:
        description: Delete releases up to and including this build number
        required: true
permissions:
  contents: write
  actions: write
jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UP_TO: ${{ inputs.up_to }}
    steps:
      - name: Delete releases and tags
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' |
          while read -r tag; do
            n="${tag#build-}"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -le "$UP_TO" ]; then
              echo "deleting $tag"
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done
      - name: Delete workflow artifacts
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" -q '.artifacts[].id' |
          while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
