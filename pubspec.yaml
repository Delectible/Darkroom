name: darkroom
description: >-
  Retro film & digicam simulator. Film Mode develops shots in a 5-minute
  darkroom and pins them to a corkboard; Digital Mode buffers shots on a
  virtual SD card browsed through a Windows 98 explorer.
publish_to: none
version: 1.4.7+44

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^3.4.3

  # Camera hardware
  camera: ^0.12.1

  # Persistence
  sqflite: ^2.4.4
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.1

  # Background work + notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
  workmanager: ^0.10.10

  # Media
  image: ^4.10.1
  # ffmpeg_kit_flutter (arthenica) was retired in 2025 and its binaries were
  # pulled. This is the maintained community fork of the same API, "min" build
  # (core FFmpeg + MediaCodec/VideoToolbox, no GPL libs).
  ffmpeg_kit_flutter_new_min: ^3.6.4
  video_player: ^2.14.1
  gal: ^2.3.3

  # Sharing
  share_plus: ^13.3.1

  # Physical orientation (the UI is portrait-locked, gravity is not)
  sensors_plus: ^7.1.1

  # Fallback live-shader path for devices still on the Skia backend
  flutter_shaders: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/artwork/
    - assets/fonts/OFL.txt
    - assets/sfx/
    - assets/shutters/
  fonts:
    # Handwriting on instant prints (SIL OFL 1.1, see assets/fonts/OFL.txt).
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-SemiBold.ttf
          weight: 600
    # Win98 explorer text: a pixel font (DotGothic16, SIL OFL 1.1).
    - family: W98
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf
  shaders:
    - shaders/film.frag
    - shaders/ccd_color.frag
    - shaders/jpeg_pixel.frag
    - shaders/vhs_scanline.frag
    - shaders/cork_board.frag
