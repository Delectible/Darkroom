name: Play Store listing
# Publishes the store listing in fastlane/metadata/android (title, short and
# full description, icon, feature graphic) to Google Play with the same
# service account the build uploads with. By hand only (Actions tab): since
# 2026-10-30 the owner edits the listing in the Play Console, which is the
# real copy; the files here are a reference and never overwrite it on their
# own. App builds are not touched.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Only these listing languages, space-separated (e.g. "es-ES fr-FR"). Empty = all, English included.'
        required: false
        default: ''
      store:
        description: 'Which store'
        type: choice
        options: [play, apple, both, check-europe]
        default: play
permissions:
  contents: read
concurrency:
  group: play-listing
  cancel-in-progress: false

jobs:
  listing:
    if: inputs.store == 'play' || inputs.store == 'both'
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Look for the Play service account
        run: |
          if [ -z "$SA" ]; then echo "::error::No PLAY_SERVICE_ACCOUNT_JSON secret."; exit 1; fi
      - uses: actions/checkout@v4
      - run: sudo gem install fastlane --no-document --quiet
      - name: Upload the listing
        env:
          LANGS: ${{ inputs.languages }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/play.json"
          # only the languages asked for: the others (English above all, which
          # the owner keeps in the Play Console) are left as they are
          if [ -n "$LANGS" ]; then
            mkdir -p "$RUNNER_TEMP/meta"
            for l in $LANGS; do cp -r "fastlane/metadata/android/$l" "$RUNNER_TEMP/meta/"; done
            rm -rf fastlane/metadata/android && mv "$RUNNER_TEMP/meta" fastlane/metadata/android
          fi
          # supply attaches the listing to a track's release; production has
          # none yet, so point it at internal testing.
          fastlane run supply \
            package_name:com.dingo.darkroom \
            json_key:"$RUNNER_TEMP/play.json" \
            metadata_path:fastlane/metadata/android \
            track:internal \
            skip_upload_apk:true \
            skip_upload_aab:true \
            skip_upload_changelogs:true \
            skip_upload_screenshots:true \
            sync_image_upload:true \
            skip_upload_images:${{ inputs.languages != '' }}

  # The App Store: the same text (fastlane/apple_listing.py maps the
  # languages and Apple's 30-character subtitles) put on the version being
  # prepared in App Store Connect; never English, never submitted for review
  # (it goes out with the next "release to iPhone").
  apple:
    if: (inputs.store == 'apple' || inputs.store == 'both') && inputs.languages != ''
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.APPSTORE_KEY }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - name: Look for the App Store Connect key
        run: |
          if [ -z "$KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "::error::App Store Connect key secrets missing."; exit 1
          fi
      - uses: actions/checkout@v4
      - run: sudo gem install fastlane --no-document --quiet
      - name: Upload the listing
        env:
          LANGS: ${{ inputs.languages }}
        run: |
          pip install --quiet PyJWT cryptography
          ASC_KEY="$KEY" ASC_KEY_ID="$KEY_ID" ASC_ISSUER="$ISSUER" \
            python3 fastlane/apple_listing.py "$RUNNER_TEMP/meta" $LANGS
          python3 -I - <<'PY' > "$RUNNER_TEMP/asc.json"
          import json, os
          print(json.dumps({"key_id": os.environ["KEY_ID"], "issuer_id": os.environ["ISSUER"],
                            "key": os.environ["KEY"], "in_house": False}))
          PY
          version=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          fastlane run deliver \
            api_key_path:"$RUNNER_TEMP/asc.json" \
            app_identifier:com.dingo.darkroom \
            platform:ios \
            app_version:"$version" \
            metadata_path:"$RUNNER_TEMP/meta" \
            skip_binary_upload:true \
            skip_screenshots:true \
            submit_for_review:false \
            run_precheck_before_submit:false \
            force:true
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.json"

  # Read-only: are the app and Pro on sale in Europe? (fastlane/eu_check.py)
  europe:
    if: inputs.store == 'check-europe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet google-auth requests PyJWT cryptography
      - name: Ask both stores
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY: ${{ secrets.APPSTORE_KEY }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/play.json"
          PLAY_JSON="$RUNNER_TEMP/play.json" python3 fastlane/eu_check.py | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/play.json"
