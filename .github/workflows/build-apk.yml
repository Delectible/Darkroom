name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack retro_cam.zip
        run: |
          unzip -q "$(ls *.zip | head -1)" -d unpacked
          echo "APP=$(dirname $(find unpacked -name pubspec.yaml | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build
        working-directory: ${{ env.APP }}
        run: |
          flutter create --org com.darkroom --project-name darkroom --platforms android .
          flutter pub get
          flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RetroCam build ${{ github.run_number }}
          files: ${{ env.APP }}/build/app/outputs/flutter-apk/app-release.apk
