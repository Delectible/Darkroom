name: Build
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iPhone app
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
env:
  ORG: com.darkroom
  APP: darkroom

jobs:
  # flutter analyze + flutter test. A build is only published when these pass.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --org $ORG --project-name $APP --platforms android .
      - name: Unpack the private upload key (repo secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "DARKROOM_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with the public test key."
          fi
      # versionCode = run number, so every build is newer than the last (Play
      # refuses to take the same versionCode twice).
      - name: Build the APK (sideloading) and app bundle (Play Store)
        env:
          DARKROOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
      - run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Darkroom-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/Darkroom-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/ }

  # Mac build minutes are free on public repos but cost 10x on private ones,
  # so on a private repo the iPhone build only runs when asked for: put [ios]
  # in the commit message, or start the workflow by hand.
  ios:
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || (github.event_name == 'push' && (!github.event.repository.private || contains(github.event.head_commit.message, '[ios]')))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Fill in the Xcode project
        run: |
          flutter create --org $ORG --project-name $APP --platforms ios .
          sed -i '' -E 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' ios/Runner.xcodeproj/project.pbxproj
      - run: flutter build ios --release --no-codesign
      - name: Package an unsigned .ipa (signed on your computer when sideloading)
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry Darkroom-${{ github.run_number }}.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/ }

  release:
    needs: [check, android, ios]
    if: always() && needs.check.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Darkroom build ${{ github.run_number }} (${{ github.ref_name }})
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          prerelease: ${{ github.ref_name != 'main' }}
          target_commitish: ${{ github.sha }}
          files: dist/*
